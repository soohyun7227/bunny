<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{
  --ink:#2a1916; --cream:#f6ecd6; --cream2:#eadcbc; --red:#c8333a; --redD:#8e2228;
  --green:#2f7d4f; --greenD:#1e4d33; --ball:#d6ea4a; --night:#1b2230; --gold:#e8c35a;
  --notch:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#120d0c;color:var(--cream);font-family:'Galmuri11',monospace;-webkit-font-smoothing:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;max-width:480px;height:100%;height:100dvh;margin:0 auto;overflow:hidden;background:var(--night)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s steps(6),visibility 0s .6s}
.screen.on{opacity:1;visibility:visible;transition:opacity .6s steps(6)}
.fill{position:absolute;inset:0;width:100%;height:100%}
.notch{clip-path:var(--notch)}
@keyframes blink{50%{opacity:.35}}

/* ---------- 인트로 ---------- */
.intro-top{position:absolute;top:5.5%;left:0;right:0;text-align:center;pointer-events:none}
.t-cream{font-weight:700;color:#f3e2a9;font-size:min(12.5vw,58px);line-height:1.08;letter-spacing:.03em;
  text-shadow:2px 0 #6e1c21,-2px 0 #6e1c21,0 2px #6e1c21,0 -2px #6e1c21,2px 2px #6e1c21,-2px 2px #6e1c21,2px -2px #6e1c21,-2px -2px #6e1c21,0 6px #3a0e12}
.intro-top .sub{margin-top:12px;font-size:13px;color:#f3e2a9;letter-spacing:.08em;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.logo-intro canvas{height:34px;width:auto;display:block}
.card-logo{display:flex;justify-content:center;margin-bottom:10px}
.card-logo canvas{height:60px;width:auto;filter:drop-shadow(0 3px 0 #123222)}
.intro-bottom{position:absolute;left:0;right:0;bottom:calc(max(48px,6%) + env(safe-area-inset-bottom,0px));text-align:center;padding:0 22px}
.t-and{color:var(--red);font-size:15px;font-weight:700;letter-spacing:.2em}
.t-red{color:var(--red);font-weight:700;font-size:min(9vw,40px);line-height:1.15;text-shadow:0 3px 0 #7a1f24}
.t-club{color:#2f5f7a;font-size:13px;margin:8px 0 18px;font-weight:700}
.slider{position:relative;height:58px;max-width:320px;margin:0 auto;background:var(--red);border:3px solid var(--ink);clip-path:var(--notch);cursor:pointer;touch-action:none;overflow:hidden}
.slider-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#e05a50}
.slider-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:46px;color:#fff;font-size:15px;font-weight:700;letter-spacing:.04em;animation:blink 1.2s steps(2) infinite}
.knob{position:absolute;left:3px;top:3px;width:46px;height:46px;background:#fff;display:grid;place-items:center;clip-path:var(--notch)}
.knob canvas{width:34px;height:34px}

/* ---------- 로딩 (게임 저장 화면 느낌) ---------- */
.ld-frame{position:absolute;top:max(16px,env(safe-area-inset-top));bottom:max(16px,env(safe-area-inset-bottom));left:16px;right:16px;border:3px solid #c99a2e;box-shadow:inset 0 0 0 4px #10211b,inset 0 0 0 6px #7d6220;pointer-events:none}
.ld-frame i{position:absolute;width:12px;height:12px;border:3px solid #c99a2e;background:#10211b}
.ld-frame i:nth-child(1){left:-9px;top:-9px}.ld-frame i:nth-child(2){right:-9px;top:-9px}.ld-frame i:nth-child(3){left:-9px;bottom:-9px}.ld-frame i:nth-child(4){right:-9px;bottom:-9px}
.ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 36px}
.ld-icons{display:flex;gap:20px;align-items:flex-end}
.ld-icons canvas{height:26px;width:auto}
.ld-panel{width:100%;max-width:330px;text-align:center;background:#14291f;border:3px solid #c99a2e;box-shadow:inset 0 0 0 3px #14291f,inset 0 0 0 5px #7d6220;padding:26px 14px 18px}
.ld-panel .load-title{font-size:min(8.6vw,40px)}
/* 로딩: 사탕 바 버전 */
:root{--px-en:'Press Start 2P','Galmuri11',monospace}
#loading .load-box{gap:18px;padding-bottom:16%}
#loading .load-title{font-family:var(--px-en);font-weight:400;font-size:min(6.6vw,30px);letter-spacing:0;color:#f6ecd6;text-shadow:0 4px 0 #0e131c}
#loading .load-title canvas{left:-.35em;top:-.95em;width:1.25em}
#loading .holly{width:120px}
#loading .bar-wrap{width:min(84%,340px)}
#loading .bar{height:32px;border:3px solid #f6ecd6;background:#0e131c;padding:3px;clip-path:var(--notch)}
#loading .bar-fill{background:repeating-linear-gradient(-45deg,#d8423a 0 7px,#f4a3a3 7px 14px);background-size:19.8px 19.8px;animation:stripe .5s steps(4) infinite}
#loading .bar-ball{width:30px;height:34px;transform:translate(-50%,-62%);animation:hop .5s steps(2) infinite}
#loading .bar-ball canvas{width:30px;height:auto;animation:none}
@keyframes hop{50%{margin-top:-3px}}
#loading .pct{font-family:var(--px-en);font-size:11px;color:#f6ecd6;min-width:46px}
#loading .load-txt{font-family:var(--px-en);font-weight:400;font-size:17px;color:#f6ecd6;min-width:10.5em;text-align:center}
#loading .load-msg{font-size:12px;color:#b9c6dc;min-height:1.2em}
#loading .load-wait{font-family:var(--px-en);font-size:10px;color:#8ea0bf;letter-spacing:.15em;animation:blink 1.2s steps(2) infinite}
.ld-sub{margin-top:12px;color:#f2c94c;font-weight:700;font-size:14px;letter-spacing:.06em}
.ld-bar{width:100%;max-width:330px}
#runner{width:100%;height:auto}
.ld-row{display:flex;align-items:center;gap:8px;border:3px solid #c99a2e;background:#14291f;padding:6px 8px}
.ld-row .xp{color:#f6ecd6;font-weight:700;font-size:12px}
.ld-row .bar{flex:1;height:16px;border:2px solid #0a1410;background:#0a1410;padding:0;clip-path:none;width:auto}
.ld-row .bar-fill{background:repeating-linear-gradient(90deg,#d8423a 0 6px,#a82c33 6px 8px);animation:none}
.hearts{display:flex;gap:4px}
.hearts canvas{width:15px;height:auto}
.ld-bar .pct{display:block;text-align:right;color:#b9a77a;font-size:11px;margin-top:6px}
.load-msg.saved{color:#f2c94c;animation:blink .5s steps(2) infinite}
#loading{background:#1b2230}
.load-box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-bottom:12%}
.load-title{position:relative;font-weight:700;font-size:min(9.5vw,44px);white-space:nowrap;color:#f6ecd6;letter-spacing:.04em;text-shadow:0 4px 0 #123222}
.load-title canvas{position:absolute;left:-.25em;top:-.62em;width:1.05em;height:auto;transform:rotate(-14deg)}
.holly{width:118px;height:auto}
.bar{position:relative;width:min(80%,330px);height:34px;background:var(--cream);border:3px solid var(--ink);padding:3px;clip-path:var(--notch)}
.bar-fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,#c8333a 0 7px,#f2a0a0 7px 14px);background-size:19.8px 19.8px;animation:stripe .5s steps(4) infinite}
@keyframes stripe{to{background-position:19.8px 0}}
.bar-wrap{position:relative;width:min(80%,330px);display:flex;align-items:center;gap:10px}
.bar-wrap .bar{flex:1;width:auto}
.bar-ball{position:absolute;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);pointer-events:none}
.bar-ball canvas{width:26px;height:26px;animation:spin .6s steps(4) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pct{font-size:14px;min-width:40px;text-align:right}
.load-txt{font-weight:700;font-size:18px}
.load-msg{font-size:12px;color:#cfe0d6;letter-spacing:.06em;min-height:1em}

/* ---------- 씬 ---------- */
#scene{background:#2a1916}
#room,#labels{position:absolute}
#labels{pointer-events:none;--fs:10px}
.tag{position:absolute;left:0;top:0;font-family:'Galmuri9','Galmuri11',monospace;font-size:var(--fs);line-height:1;padding:2px 3px 3px;background:rgba(34,20,18,.82);color:#f6ecd6;white-space:nowrap;will-change:transform}
.tag.pres{background:var(--gold);color:var(--ink);font-weight:700}
.tag.pres::after{content:'';display:inline-block;width:12px;height:10px;margin-left:4px;vertical-align:-1px;background:var(--scroll) no-repeat center/contain;image-rendering:pixelated}
.tag.staff{background:#2f7d4f;text-align:center}
.tag.staff b{display:block;font-weight:400;font-size:.85em;color:#f3e2a9;margin-bottom:2px}
.bubble{position:absolute;left:0;top:0;font-size:calc(var(--fs) + 2px);line-height:1.35;padding:5px 7px;background:#fff;color:var(--ink);border:2px solid var(--ink);white-space:nowrap;max-width:none;z-index:2;display:none;will-change:transform}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:6px;height:6px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.wrap{white-space:normal;width:max-content;max-width:min(62vw,260px)}
.bubble.pres{font-size:calc(var(--fs) + 3px);white-space:normal;width:max-content;max-width:62vw;max-width:min(62vw,280px)}
.banner-txt{position:absolute;display:flex;align-items:center;justify-content:center;color:#f6ecd6;font-weight:700;white-space:nowrap;text-shadow:0 1px 0 #000}
.top-btns{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;display:flex;gap:6px;z-index:5}
#scene .top-btns .chip{font-size:10px;padding:5px 8px;background:#f6ecd6;color:#2a1916;border:2px solid #2a1916;box-shadow:0 2px 0 #2a1916}
#scene .top-btns .chip:active{transform:translateY(2px);box-shadow:none}
#scene .top-btns #reloadBtn{font-size:13px;padding:3px 8px}
.chip{font-size:11px;font-weight:700;padding:7px 10px;background:rgba(246,236,214,.95);color:var(--ink);border:2px solid var(--ink)}
.chip.hide{display:none}
#reloadBtn{font-size:15px;line-height:1;padding:5px 10px}
.reopen{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;font-weight:700;font-size:14px;padding:12px 18px;background:var(--red);color:#fff;border:3px solid var(--ink);clip-path:var(--notch);display:none;animation:blink 1.4s steps(2) infinite}
.reopen.show{display:block}
.hint{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;font-size:11px;color:#c9b79a;z-index:4;pointer-events:none}

/* ---------- 초대장 카드 ---------- */
#cardWrap{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px 16px;background:rgba(18,10,8,.55)}
#cardWrap.show{display:flex}
.card{width:100%;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--cream);color:var(--ink);border:4px solid var(--ink);clip-path:var(--notch);animation:pop .55s steps(7) both;-webkit-user-select:text;user-select:text}
@keyframes pop{0%{transform:scale(.3) translateY(40px);opacity:0}55%{transform:scale(1.05);opacity:1}100%{transform:none}}
.card-head{position:relative;background:var(--green);color:#fff;text-align:center;padding:16px 12px 14px;border-bottom:4px solid var(--ink)}
.card-head .inv{font-size:12px;letter-spacing:.3em;color:#cfe8d6;display:flex;align-items:center;justify-content:center;gap:8px}
.card-head .inv canvas{width:14px;height:14px}
.card-head .club{margin-top:10px;font-size:13px;color:#f3e2a9}
.card-head h1{font-size:30px;line-height:1.2;margin-top:4px;text-shadow:0 3px 0 #123222}
.card-body{padding:18px 18px 4px}
.msg{font-size:13px;line-height:1.8;word-break:keep-all;margin-bottom:16px}
.info{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.row{display:flex;gap:10px;align-items:flex-start}
.row dt{flex:0 0 64px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;padding:4px 0;background:var(--red);color:#fff}
.row:nth-child(2n) dt{background:var(--green)}
.row dd{font-size:13px;line-height:1.6;word-break:keep-all}
.row dd small{display:block;font-size:11px;color:#6d5a4a}
.row ol{list-style:none;counter-reset:a}
.row ol li{counter-increment:a}
.row ol li::before{content:counter(a) ". ";color:var(--red);font-weight:700}
.btns{display:grid;gap:10px;margin-bottom:14px}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:13px 10px;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);margin-bottom:4px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact{text-align:center;font-size:12px;color:#6d5a4a;margin-bottom:14px}
.contact a{color:var(--ink);font-weight:700}
.card-foot{display:flex;border-top:3px dashed #cdbb98}
.card-foot button{flex:1;padding:14px 6px;font-size:13px;font-weight:700;color:#6d5a4a}
.card-foot button+button{border-left:3px dashed #cdbb98}
.card-head.red{background:var(--red)}
.card-head.navy{background:#2f4f86}
.xwrap{position:sticky;top:0;height:0;z-index:6}
.card-x{position:absolute;top:10px;right:10px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;line-height:1;background:var(--cream);color:var(--ink);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);padding:0}
.card-x:active{transform:translateY(2px);box-shadow:none}
.fin-sum{border:3px solid var(--ink);background:#fbf4e4;margin-bottom:16px}
.fin-sum div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-bottom:2px dashed #cdbb98;font-variant-numeric:tabular-nums}
.fin-sum span{font-size:12px;color:#6d5a4a}.fin-sum b{font-size:15px}
.fin-sum .p b{color:var(--green)}.fin-sum .m b{color:var(--red)}
.fin-sum .bal{background:var(--green);color:#fff;border-bottom:0;padding:12px}.fin-sum .bal span{color:#cfe8d6;font-weight:700;font-size:13px}.fin-sum .bal b{font-size:24px;color:#fff;text-shadow:0 2px 0 #123222}.fin-sum .bal small{font-size:12px;margin-left:2px}
.fin-h{font-size:14px;margin:4px 0 8px;display:flex;justify-content:space-between;align-items:baseline}.fin-h small{font-size:11px;color:#6d5a4a;font-weight:400;display:flex;align-items:center;gap:4px}
.fin-bars{list-style:none;margin:0 0 16px;padding:0}.fin-bars li{margin-bottom:8px}
.fb-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:3px;font-variant-numeric:tabular-nums}.fb-top small{display:block;font-size:10px;color:#8a7560;margin-top:1px}
.fin-bars i{display:block;height:8px;border:2px solid var(--ink);box-sizing:border-box}.fin-bars.in i{background:var(--green)}.fin-bars.out i{background:var(--red)}
.fin-mon{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;height:96px;padding:0 0 16px;margin-bottom:12px;border-bottom:2px solid var(--ink)}
.fin-mon div{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:1px}
.fin-mon span{width:40%;min-height:1px}.fin-mon .in,.lg.in{background:var(--green)}.fin-mon .out,.lg.out{background:var(--red)}
.fin-mon em{position:absolute;bottom:-16px;font-style:normal;font-size:9px;color:#6d5a4a}
.lg{display:inline-block;width:8px;height:8px;margin-left:6px}
.news-mast{background:#fbf7ee;color:var(--ink);text-align:center;padding:16px 14px 10px;border-bottom:4px double var(--ink)}
.nm-top,.nm-bot{display:flex;justify-content:space-between;font-size:10px;color:#6d5a4a;border-bottom:2px solid var(--ink);padding:0 44px 5px 0}
.nm-bot{justify-content:center;border:0;border-top:2px solid var(--ink);padding:5px 0 0}
.news-mast h1{font-size:34px;letter-spacing:.06em;margin:8px 0;text-shadow:0 3px 0 #e0d2b4}
.card-body.news{background:#fbf7ee}
.nw{padding:0 0 14px;margin-bottom:14px;border-bottom:2px dashed #cdbb98}
.nw-ph{aspect-ratio:3/2;border:3px solid var(--ink);margin-bottom:8px;overflow:hidden;filter:sepia(.25) contrast(1.05)}.nw-ph img{width:100%;height:100%;object-fit:cover;display:block}
.nw:not(.top) .nw-ph{float:right;width:36%;margin:0 0 6px 10px;border-width:2px}
.nw::after{content:'';display:block;clear:both}
.nw-tag{display:flex;align-items:center;gap:6px;font-size:10px;color:#8a7560;margin-bottom:4px}.nw-tag b{background:var(--red);color:#fff;padding:2px 6px;font-size:10px}
.nw h3{font-size:16px;line-height:1.35;margin:0 0 5px;word-break:keep-all}.nw.top h3{font-size:19px}
.nw-body{margin:0;font:13px/1.65 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#3a2a22;word-break:keep-all}
.nw-h{font-size:13px;text-align:center;margin:2px 0 8px;letter-spacing:.1em}
.nw-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.nw-stats div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:2px solid var(--ink);background:#fff}.nw-stats b{font-size:17px;color:var(--red)}.nw-stats span{font-size:9.5px;color:#6d5a4a;text-align:center;word-break:keep-all}
.aw-ctrl{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:62px;z-index:6;display:none;align-items:center;justify-content:space-between;gap:8px;padding:0 14px}
.aw-ctrl.on{display:flex}
.aw-live .dock{display:none!important}
.aw-ctrl button{font-weight:700;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);white-space:nowrap;padding:10px 14px;font-size:13px}
.aw-ctrl button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.aw-ctrl button[hidden]{visibility:hidden;display:block}
.aw-prev{background:var(--cream);color:var(--ink)}
.aw-next{background:var(--red);color:#fff;animation:nbPulse 1.2s steps(2) infinite}
.aw-next.gold{background:var(--gold);color:var(--ink)}
.aw-all{padding:7px 10px!important;font-size:11px!important;background:transparent;color:#e9dcbf;border-color:#6d5a4a!important;box-shadow:none!important}
@keyframes nbPulse{50%{filter:brightness(1.15)}}
.box-note{font-size:12px;line-height:1.7;color:#6d5a4a;text-align:center;margin-bottom:12px;word-break:keep-all}
#boxMsg{display:block;width:100%;min-height:150px;resize:vertical;padding:10px 12px;border:3px solid var(--ink);background:#fff;color:var(--ink);font:16px/1.6 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-user-select:text;user-select:text;border-radius:0;outline:none}

  rules: `제1장 총칙
제1조 (명칭)
본 클럽은 ‘더블U’(이하 ‘더블U 테니스클럽’이라 한다)라 칭한다.

제2조 (목적)
본 클럽은 테니스를 통해 회원의 건강 증진, 친목 도모 및 실력 향상을 목적으로 한다.
단순한 친목 모임을 넘어, 정기적인 연습과 대회 참여를 통해 경기력을 향상시키고

제3조 (구성 및 연령대)
본 클럽은 20~50대 여성 회원으로 구성한다.

제2장 회원
제4조 (회원 자격 및 가입)
① 본 클럽의 목적과 취지에 동의하는 20~50대 여성은 회원 가입이 가능하다.
② 신규 회원은 기존 회원의 추천을 받거나, SNS(인스타그램, 밴드 등)를 통해
최소 1회 게스트 참여 후 가입 신청을 할 수 있다.
③ 가입 신청 후, 휴회 회원을 제외한 기존 회원을 대상으로 무기명 투표를 진행하며,
과반수 찬성 시 정회원 활동이 가능하다.
④ 가입비는 별도로 두지 않으며, 가입과 동시에 본 회칙을 준수해야 한다.

제5조 (회원의 권리와 의무)
① 회원은 클럽 활동에 참여할 권리와 함께 발언권 및 투표권을 가진다.
② 회원은 회비를 성실히 납부하고, 클럽 운영 및 행사에 적극 협조해야 한다.
③ 회원은 개인 실력 향상을 위해 노력하며, 연습 및 대회 참여에 성실히 임해야 한다.
④ 클럽의 명예를 훼손하거나 타 회원에게 피해를 주는 행위를 해서는 안 된다.

제6조 (회원 휴회, 탈퇴 및 제명)
① 회원은 개인 사정으로 휴회를 신청할 수 있으며, 휴회 기간은 최대 6개월로 한다.
② 6개월 초과 휴회가 필요한 경우, 운영진(회장·총무·홍보이사) 회의를 통해 승인 여부를 결정한다.
③ 휴회 승인 기준은 다음과 같다.
 1. 휴회 불가 사유
   - 더블U 모임 참석이 어렵다는 사유만으로는 휴회 신청이 불가하다.
   - 일정 불규칙, 개인 스케줄 사유 등은 휴회 사유로 인정되지 않는다.
 2. 운영진 심의 후 휴회 가능 사유
   - 취업 준비, 타지역 파견, 장기 출장 등으로 일정 기간 테니스를 전혀 칠 수 없는 경우
   - 운영진 논의를 통해 휴회 승인 가능
 3. 출산 및 육아로 인한 휴회
   - 출산 및 육아로 인한 장기 휴회는 허용하며
   - 여건이 마련되는 시점에 회원 활동을 재개할 수 있다.
④ 휴회 회원은
 - 참석 점수 및 포인트 산정에서 제외되며
 - 총회 의결권은 가지지 않는다.
 - 단, 총회 참석 자체는 가능하다.
⑤ 회원이 자발적으로 탈퇴한 경우, 재가입은 원칙적으로 제한하며 운영진 심의를 통해 예외적으로 허용할 수 있다.
⑥ 회비 미납, 비신사적인 행위, 반복적인 불성실 참여 등으로 클럽 운영에 지장을 주는 회원은 운영진 논의 후 제명할 수 있다.

제3장 운영 및 모임
제7조 (정기 모임 및 행사)
① 정기 모임은 매월 마지막 주 화요일에 진행하는 것을 원칙으로 하며, 상황에 따라 변경될 수 있다.
② 분기대회는 2월, 5월, 8월, 11월에 개최하며, 월례회 성격을 가진다.
③ 총회는 12월 정기모임 날에 개최하며, 주요 안건을 논의 및 결정한다.
④ 필요 시 대회 준비 및 실력 향상을 위한 추가 연습 모임을 운영할 수 있다.

제8조 (회비, 게스트비 및 포인트 제도)
① 회원 회비는 월 15,000원으로 하며, 모임 운영비로 사용한다.
② 비회원(게스트)의 참가비는 다음과 같이 구분한다.
 - 실내 코트 : 10,000원
 - 실외 코트 : 5,000원
③ 코트 예약 성공자에 한해 포인트 0.5점을 부여한다.
④ 회비 및 게스트비 사용 내역은 총회에서 투명하게 보고한다.
⑤ 이미 납부한 회비는 환불되지 않는다.

제4장 운영진
제9조 (운영진 구성 및 역할)
① 클럽 운영을 위해 회장, 총무, 홍보이사로 구성된 운영진을 둔다.
② 회장은 클럽을 대표하며 운영 전반을 총괄한다.
③ 총무는 회계 및 행정 업무를 담당한다.
④ 홍보이사는 클럽 대내외 홍보 및 신규 회원 모집을 담당한다.

제10조 (운영진 선출 및 임기)
① 운영진은 회원 투표를 통해 선출한다.
② 임기는 1년으로 하며, 연임할 수 있다.

제5장 기타
제11조 (게스트 운영 및 분기대회 참여)
① 가입 의사가 있는 게스트의 경우,

function pixelLogo(h,cb){const img=new Image();img.onload=()=>{
  const sw=img.naturalWidth,sh=Math.round(img.naturalHeight*.83),w=Math.round(h*sw/sh),cv=document.createElement('canvas'),c=cv.getContext('2d');
  cv.width=w;cv.height=h;c.imageSmoothingQuality='high';c.drawImage(img,0,0,sw,sh,0,0,w,h);
  const d=c.getImageData(0,0,w,h),p=d.data;
  for(let i=0;i<p.length;i+=4){const m=Math.max(p[i],p[i+1],p[i+2]);if(m<70){p[i+3]=0;continue}p[i+3]=255;
    if(m<200){const k=Math.min(2,215/m);p[i]=Math.min(255,p[i]*k);p[i+1]=Math.min(255,p[i+1]*k);p[i+2]=Math.min(255,p[i+2]*k)}}
  c.putImageData(d,0,0);cb(cv)};img.src=LOGO_SRC}

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function pxCtx(cv,w,h){cv.width=w;cv.height=h;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;return c}
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x|0,y|0,w,h)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* ---------- 효과음 ---------- */
const Sfx={ctx:null,on:true,last:{},
  init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},
  // iOS는 터치하는 그 순간에 오디오를 깨워야 소리가 나서, 첫 터치마다 무음 소리를 한 번 재생해 둠
  unlock(){this.init();const a=this.ctx;if(!a||this.ready)return;try{if(a.state!=='running')a.resume();
    const s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0);
    if(a.state==='running'){this.ready=true;if(screen!=='intro')BGM.start()}}catch(e){}},
  tone(f,d,o={}){if(!this.on||!this.ctx)return;if(this.ctx.state!=='running')this.ctx.resume();const{type='square',vol=.035,at=0,slide=0}=o;const t=this.ctx.currentTime+at;
    const os=this.ctx.createOscillator(),g=this.ctx.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
    if(slide)os.frequency.linearRampToValueAtTime(f+slide,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    os.connect(g);g.connect(this.ctx.destination);os.start(t);os.stop(t+d+.02)},
  ok(k,ms){const n=performance.now();if(n-(this.last[k]||0)<ms)return false;this.last[k]=n;return true},
  step(){if(this.ok('step',95))this.tone(150+Math.random()*70,.03,{vol:.018})},
  pop(){this.tone(520,.07,{slide:420,vol:.03})},
  blip(){if(this.ok('blip',50))this.tone(620+Math.random()*140,.03,{vol:.016})},
  tick(){if(this.ok('tick',110))this.tone(900,.02,{vol:.014})},
  drum(){for(let i=0;i<18;i++)this.tone(90+Math.random()*30,.05,{at:i*.055,type:'triangle',vol:.06})},
  swipe(){[392,523,659,784].forEach((f,i)=>this.tone(f,.09,{at:i*.07}))},
  fanfare(){[[523,0],[659,.1],[784,.2],[1047,.3],[784,.46],[1047,.56]].forEach(([f,a])=>this.tone(f,.15,{at:a,vol:.04}))}
};

/* ---------- 배경 음악 (We Wish You a Merry Christmas, 저작권이 끝난 전통 캐럴을 직접 연주, 오르골 소리) ---------- */
const BGM={playing:false,g:null,timer:null,song:0,i:0,t:0,level:1,
  // [음, 길이] : 길이는 각 곡의 박 단위. '-' 는 쉼표
  songs:[
    {unit:.42,notes:[['D4',1],['G4',1],['G4',.5],['A4',.5],['G4',.5],['F#4',.5],['E4',1],['E4',1],['E4',1],['A4',1],['A4',.5],['B4',.5],['A4',.5],['G4',.5],['F#4',1],['D4',1],['D4',1],['B4',1],['B4',.5],['C5',.5],['B4',.5],['A4',.5],['G4',1],['E4',1],['D4',.5],['D4',.5],['E4',1],['A4',1],['F#4',1],['G4',2],['-',1],
      ['D4',1],['G4',1],['G4',1],['G4',1],['F#4',2],['F#4',1],['G4',1],['F#4',1],['E4',1],['D4',2],['A4',1],['B4',1],['A4',1],['G4',1],['D5',1],['D4',1],['D4',.5],['D4',.5],['E4',1],['A4',1],['F#4',1],['G4',3],['-',2]]}

  ],
  hz(n){const m=/^([A-G])(#?)(\d)$/.exec(n),s={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(s+12*(+m[3]+1)-69)/12)},
  start(){const a=Sfx.ctx;if(this.playing||!a)return;this.playing=true;
    this.g=a.createGain();this.g.gain.value=0;this.g.connect(a.destination);
    const d=a.createDelay(1),fb=a.createGain(),wet=a.createGain();d.delayTime.value=.33;fb.gain.value=.25;wet.gain.value=.28;
    this.g.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(a.destination);
    this.song=0;this.i=0;this.t=a.currentTime+.3;this.apply(.8);
    this.timer=setInterval(()=>this.tick(),120)},
  apply(sec=.4){if(!this.g)return;const v=(Sfx.on&&!document.hidden)?this.level:0;this.g.gain.setTargetAtTime(v,Sfx.ctx.currentTime,sec/3)},
  duck(v){this.level=v;this.apply()},
  tick(){const a=Sfx.ctx;if(!a)return;
    while(this.t<a.currentTime+.8){const S=this.songs[this.song],[n,len]=S.notes[this.i],dur=len*S.unit;
      if(n!=='-')this.note(this.hz(n),this.t,dur);
      this.t+=dur;this.i++;if(this.i>=S.notes.length){this.i=0;this.song=(this.song+1)%this.songs.length}}},
  note(f,t,dur){const a=Sfx.ctx,end=t+Math.min(Math.max(dur*1.4,.5),1.6);
    [[f,'triangle',.05],[f*2,'sine',.016]].forEach(([fr,type,v])=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(fr,t);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0005,end);o.connect(g);g.connect(this.g);o.start(t);o.stop(end+.05)})}
};

function ballSprite(n){const cv=document.createElement('canvas');const c=pxCtx(cv,n,n);const r=n/2;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const dx=x+.5-r,dy=y+.5-r,d=Math.hypot(dx,dy);if(d>r-.1)continue;
    let col='#d3e94a';if(dx+dy>r*.55)col='#a9c22f';if(dx+dy<-r*.75)col='#effa9a';
    const s1=Math.abs(Math.hypot(dx+r*1.05,dy)-r*.8),s2=Math.abs(Math.hypot(dx-r*1.05,dy)-r*.8);
    if(s1<.6||s2<.6)col='#fbfbf0';if(d>r-1.1)col='#7d8f1e';R(c,x,y,1,1,col)}return cv}

        cheers(2);for(let j=0;j<60&&a.chars.some(c=>c.state==='walk');j++)await w(100)}
      a.chars.forEach(putWinner);a.chars.forEach(c=>c.hop=.28);

function rulesHTML(){
  const C=CONFIG,out=[],chaps=[];let last=null,ci=0;
  for(const raw of (C.rules||'').split('\n')){
    const line=raw.replace(/\s+$/,'');if(!line.trim()){last=null;continue}
    let m;
    if((m=/^(제\d+장)\s*(.*)$/.exec(line))){ci++;chaps.push([ci,m[1],m[2]]);out.push(`<h3 id="rc${ci}"><span>${esc(m[1])}</span>${esc(m[2])}</h3>`);last=null}
    else if((m=/^(제\d+조)\s*\(?([^)]*)\)?\s*$/.exec(line))){out.push(`<h4><span class="an">${esc(m[1])}</span>${esc(m[2])}</h4>`);last=null}
    else if((m=/^([①-⑳])\s*(.*)$/.exec(line))){out.push({cls:'ri',num:m[1],t:m[2]});last=out[out.length-1]}
    else if((m=/^\s+(\d+\.)\s*(.*)$/.exec(line))){out.push({cls:'ri2',num:m[1],t:m[2]});last=out[out.length-1]}
    else if((m=/^(\s*)-\s*(.*)$/.exec(line))){out.push({cls:m[1].length>=3?'ri3 deep':'ri3',t:m[2]});last=out[out.length-1]}
    else if(last&&(last.cls==='ri'||last.cls==='rp')){last.t+=' '+line.trim()}
    else{out.push({cls:'rp',t:line.trim()});last=out[out.length-1]}
  }
  const body=out.map(o=>typeof o==='string'?o:o.cls==='rp'?`<p class="rp">${esc(o.t)}</p>`:o.cls.startsWith('ri3')?`<p class="${o.cls}">${esc(o.t)}</p>`:`<p class="${o.cls}"><b>${esc(o.num)}</b>${esc(o.t)}</p>`).join('');

  if(S.room!=='hall'){S.room='hall';placeRoom()}

function downloadICS(){
  const s=new Date(CONFIG.start),e=new Date(s.getTime()+CONFIG.hours*3600e3),f=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//invite//KO","BEGIN:VEVENT",`UID:${Date.now()}@invite`,`DTSTART:${f(s)}`,`DTEND:${f(e)}`,`SUMMARY:${CONFIG.club} ${CONFIG.title}`,`LOCATION:${CONFIG.place} ${CONFIG.address}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='invite.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- 화면 전환 / 이벤트 ---------- */
let screen='intro';
function show(id){screen=id;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
$('#skipBtn').onclick=skip;
$('#nextBtn').onclick=()=>{if(!S.steps||S.step>=S.steps.length-1)return;Sfx.pop();applyStep(S.step+1,true)};
$('#prevBtn').onclick=()=>{if(!S.steps||S.step<=0)return;Sfx.pop();applyStep(S.step-1,false)};
$('#allBtn').onclick=()=>{if(!S.steps)return;Sfx.pop();finalResult()};
$('#reloadBtn').onclick=()=>{location.href=location.pathname+'?v='+Date.now()+location.hash};
$('#dock').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||S.moving)return;const k=b.dataset.k;Sfx.pop();if(k==='stage')goRoom(S.room==='stage'?'hall':'stage');else openCard(k)});
$('#muteBtn').onclick=()=>{Sfx.on=!Sfx.on;$('#muteBtn').textContent=Sfx.on?'♪ ON':'♪ OFF';BGM.apply(.2)};
SC.cv.addEventListener('pointerdown',e=>{if(S.moving||S.intro)return;const r=SC.cv.getBoundingClientRect(),x=(e.clientX-r.left)/SC.scale,y=(e.clientY-r.top)/SC.scale;
  if(S.dockOn&&S.room==='hall')for(const h of HOTSPOTS)if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){if(h.k==='santa'){santaGo();return}if(h.k==='light'){lightToggle();return}if(h.k==='cake'){cheersAll();return}Sfx.pop();if(h.k==='stage')goRoom('stage');else openCard(h.k);return}
  if(S.room==='stage'&&S.mode==='result'){if(x>80&&x<100&&y>100&&y<120){burst(50,90,110);Sfx.pop();openCard('awards');return}}
  else if(S.room==='stage'){if(x>70&&x<110&&y>140&&y<185){burst(60);Sfx.fanfare();toast(CONFIG.awardCaption[1]||'')}else if(PODS.some(p=>x>=p.x&&x<=p.x+p.w&&y>=p.top-14&&y<=262)){Sfx.blip();toast(CONFIG.awardCaption[1]||'')}return}
  let best=null,bd=1e9;for(const ch of [S.pres,...S.chars,...S.guests]){if(ch.state!=='sit'||ch.hidden)continue;const hy=ch.y-10,d=Math.hypot(ch.x-x,(hy-y)*.7);if(d<bd){bd=d;best=ch}}
  if(best&&bd<14&&S.room==='hall'){stampChar(best);if(!best.isPres&&best.role!=='총무'&&tapChar(best))return}
  if(best&&bd<14&&best.role==='총무'&&S.room==='hall'&&CONFIG.finance){greet(best,'투명하게 보고드려요!',1200);setTimeout(()=>openCard('finance'),650);return}
  if(best&&bd<14&&best.isPres&&S.room==='hall'&&CONFIG.rules){greet(best,'회칙 보여드릴게요!',1200);setTimeout(()=>openCard('rules'),650);return}
  if(best&&bd<14){const myAw=best.onPodium&&S.awardList.find(a=>a.chars.includes(best));const g=myAw?[myAw.title+' 받았어요!','감사합니다!','최고의 한 해!']:best.onPodium?['감사합니다!','최고의 한 해!','내년에도 열심히!']:best.isPres?['총회에서 만나요!','올해도 고마웠어요','메리 크리스마스!']:(S.room==='stage'?CONFIG.resultCheers:CONFIG.greetings);greet(best,g[Math.floor(Math.random()*g.length)])}});

function onResize(){resizeIntro();resizeLoading();layoutScene()}
// 창 크기가 나중에 잡히거나 바뀌면 다시 계산
if(window.ResizeObserver){let rq=0;new ResizeObserver(()=>{clearTimeout(rq);rq=setTimeout(onResize,60)}).observe($('#app'))}
addEventListener('resize',onResize);
['touchstart','touchend','pointerdown','pointerup','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>Sfx.unlock(),{capture:true,passive:true}));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(onResize);

$('#introSub').textContent=CONFIG.club;pixelLogo(17,cv=>$('#logoIntro').appendChild(cv));$('#introTitle').textContent=CONFIG.title;$('#introClub').textContent=`${CONFIG.date} · ${CONFIG.time}`;
const lt=$('#loadTitle');lt.textContent=CONFIG.loadingTitle;lt.appendChild(HAT_SPRITE);HOLLY.className='holly';$('#hollyBox').appendChild(HOLLY);$('#barBall').appendChild(hatBall());
{const sc=strSprite(['.kkkkkkkkk.','kccccccccck','.cllllllcc.','.ccccccccc.','.clllllccc.','.ccccccccc.','kccccccccck','.kkkkkkkkk.'],{k:'#8a5a32',c:'#fbf4e4',l:'#b9a77a'});document.documentElement.style.setProperty('--scroll',`url(${sc.toDataURL()})`)}
SC.ctx=pxCtx(SC.cv,RW,RH);buildScene();initStage();onResize();loadResults();

let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(screen==='intro')drawIntro(T,dt);else if(screen==='loading')drawLoading(T,dt);
  else{[S.pres,...S.chars].forEach(c=>updateChar(c,dt));drawSceneFrame(T,dt);updateLabels();
    if(!cardOpen&&S.dockOn&&!S.moving&&(S.room==='hall'||(S.room==='stage'&&S.mode==='result'&&S.resultDone))){idleT-=dt;if(idleT<=0){idleT=2.6+Math.random()*2;const pool=S.chars.filter(x=>!x.hidden),c=pool[Math.floor(Math.random()*pool.length)],L=S.room==='stage'?(c&&c.onPodium?['감사합니다!']:CONFIG.resultCheers):CONFIG.greetings;if(c)greet(c,L[Math.floor(Math.random()*L.length)],1500)}}}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* 카톡 미리보기 이미지 만들기용 화면 (주소 끝에 #og 를 붙이면 1200x630 그림이 나옴) */
function renderOG(){
  document.body.innerHTML='';document.documentElement.style.cssText='margin:0;background:#1b2230';
  document.body.style.cssText='margin:0;width:1200px;height:630px;overflow:hidden;background:#1b2230;font-family:Galmuri11,monospace';
  const wrap=document.createElement('div');wrap.style.cssText='position:relative;width:1200px;height:630px';document.body.appendChild(wrap);
  const cv=document.createElement('canvas');cv.style.cssText='position:absolute;left:0;top:0;width:1200px;height:630px;image-rendering:pixelated';const c=pxCtx(cv,240,126);wrap.appendChild(cv);
  ['#1b2230','#1d2434','#1f2737','#222b3d'].forEach((col,i)=>R(c,0,i*26,240,126,col));
  const r=mulberry32(12);for(let i=0;i<70;i++){const x=r()*240|0,y=r()*100|0,big=r()<.15;R(c,x,y,1,1,big?'#ffffff':'#9fb3d6');if(big){c.fillStyle='rgba(255,255,255,.4)';c.fillRect(x-1,y,3,1);c.fillRect(x,y-1,1,3)}}
  R(c,0,96,240,2,'#2b3446');R(c,0,99,240,3,'#353f53');
  for(let i=0;i<5;i++){const x=[8,16,212,222,230][i];drawBare(c,x,104,[16,11,15,10,13][i])}
  R(c,0,104,240,22,'#bfe2f1');R(c,0,104,240,1,'#dbf1fb');for(let i=0;i<26;i++)R(c,r()*240|0,106+(r()*18|0),2+(r()*6|0),1,'#93c8e0');
  for(let i=0;i<4;i++)R(c,22+i*2,105+i,80-i*4,1,i?'#e6f4fb':'#ffffff');
  const T=makeTree3(70,11),ox=62-T.cx,oy=107-T.baseY;c.drawImage(T.cv,ox,oy);T.lights.forEach((l,i)=>{if(i%2)R(c,ox+l.x,oy+l.y,1,1,l.col)});
  c.fillStyle='rgba(255,233,138,.5)';c.fillRect(ox+T.starX,oy+T.starY-7,1,2);c.fillRect(ox+T.starX-7,oy+T.starY-1,2,1);c.fillRect(ox+T.starX+6,oy+T.starY-1,2,1);
  c.drawImage(REINDEER,62-42,93);c.drawImage(SANTA[1],62-6,93);c.drawImage(PENGUIN,62+24,94);
  for(let i=0;i<60;i++){const x=r()*240|0,y=r()*120|0;R(c,x,y,r()<.2?2:1,r()<.2?2:1,'#ffffff')}
  const tx=document.createElement('div');tx.style.cssText='position:absolute;left:560px;right:40px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px';
  tx.innerHTML=`<div id="ogLogo" style="display:flex;align-items:center;gap:14px;color:#f3e2a9;font-size:26px;font-weight:700;letter-spacing:.08em"></div>
    <div style="font-family:'Press Start 2P',Galmuri11,monospace;font-size:44px;line-height:1.3;color:#f3e2a9;text-shadow:4px 0 #6e1c21,-4px 0 #6e1c21,0 4px #6e1c21,0 -4px #6e1c21,4px 4px #6e1c21,-4px 4px #6e1c21,4px -4px #6e1c21,-4px -4px #6e1c21,0 10px #3a0e12">MERRY<br>CHRISTMAS</div>
    <div style="margin-top:6px;font-size:56px;font-weight:700;color:#ff5a5f;text-shadow:0 5px 0 #6e1c21">${esc(CONFIG.title)}</div>
    <div style="font-size:26px;color:#dbe6f5;letter-spacing:.02em">${esc(CONFIG.date)} · ${esc(CONFIG.time)}</div>
    <div style="font-size:22px;color:#f3e2a9">📍 ${esc(CONFIG.place)}</div>
    <div style="margin-top:6px;padding:10px 22px;background:#c8333a;color:#fff;font-size:22px;font-weight:700;border:4px solid #2a1916">초대장 열어보기 ▶</div>`;
  wrap.appendChild(tx);
  pixelLogo(26,lc=>{lc.style.cssText='height:64px;width:auto;image-rendering:pixelated';const box=$('#ogLogo');box.appendChild(lc);box.append(CONFIG.club)});
}
if(location.hash==='#og')renderOG();

/* 미리보기 링크에서 새 버전이 올라와도, 이미 초대장까지 본 사람은 처음으로 돌아가지 않게 */
function boot(data){if(data&&data.seen){show('scene');layoutScene();S.chars.forEach(seatNow);showDock();if(Date.now()<INVITE_AUTO_UNTIL)openCard('invite')}}
try{const hot=window.claude&&window.claude.hot;
  if(hot){if(hot.snapshot)hot.snapshot(()=>({seen:screen==='scene'}));hot.ready?hot.ready(boot):boot(hot.data||{})}}catch(e){}
</script>
