<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="bunnytori의 픽셀 작업방. 제로와 콜라가 함께 살아요.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bunny's Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: phone-first single column — compact portrait pixel room, then status cards and day/night switch */
:root{
  --bg:#1b261f; --panel:#25342a; --line:#3a4f3f; --fg:#f4f2e6; --muted:#b5bda6;
  --accent:#f2c230; --warm:#ffe27a; --olive:#8f9d3e; --deep:#1f4a33;
  --f-display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,sans-serif;
  --f-pixel:"Press Start 2P",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));margin:0}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-direction:column;gap:6px}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{display:none}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(18px,5.8vw,22px);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.work{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.work b{color:var(--warm);font-weight:700}
.clock{font-family:var(--f-pixel);font-size:12px;background:var(--panel);border:2px solid var(--line);padding:7px 9px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{position:relative;width:min(100%,calc((100vh - 128px)*.8));width:min(100%,calc((100dvh - 128px)*.8));margin:0 auto;border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px var(--olive),0 10px 30px rgba(0,0,0,.35)}
canvas#home{display:block;width:100%;height:auto;aspect-ratio:160/200;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
.bubble{font-size:11px;background:#fffdf3;color:#26301f;padding:1px 7px;border-radius:5px;border:2px solid #26301f;position:relative;font-weight:700}
.bubble:empty{display:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:4px solid transparent;border-top-color:#26301f}
.bubble.pop{background:var(--warm)}
.name{font-family:var(--f-display);font-size:11px;color:#fff;background:rgba(31,74,51,.9);padding:0 6px;border-radius:3px}
.tag.dog .name{background:var(--olive)}
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.who{background:var(--panel);border:2px solid var(--line);border-top:4px solid var(--olive);border-radius:6px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0;cursor:pointer;font:inherit;color:inherit}
.who canvas{width:40px;height:40px;image-rendering:pixelated}
.who b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--warm)}
.who span{font-size:11px;color:var(--muted);line-height:1.3;min-height:2.6em}
.who:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:2px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;background:var(--panel);color:var(--fg);border:0;padding:8px 14px;cursor:pointer}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#2a1d05;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin:0}
.badge{position:absolute;transform:translate(-50%,-50%);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#c0392b;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fffdf3;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.badge.tap{background:var(--accent);color:#2a1d05;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-70%)}}
@media (prefers-reduced-motion:reduce){.badge.tap{animation:none}}
/* schedule sheet */
[hidden]{display:none!important}
.scrim{position:fixed;inset:0;background:rgba(8,14,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:#fbf8ec;color:#26301f;border-radius:16px 16px 0 0;border:3px solid var(--deep);border-bottom:0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh-head h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;flex:1;color:var(--deep)}
.ib{font:inherit;font-size:13px;font-weight:700;border:2px solid var(--deep);background:#fff;color:var(--deep);border-radius:8px;padding:6px 10px;cursor:pointer}
.ib.go{background:var(--accent);border-color:#b48a12;color:#2a1d05}
.ib:disabled{opacity:.5;cursor:default}
.ib:focus-visible,.chk:focus-visible{outline:2px solid #b48a12;outline-offset:2px}
.day{font-family:var(--f-display);font-size:15px;color:var(--olive);margin:12px 0 6px}
.ev{display:grid;grid-template-columns:30px 54px minmax(0,1fr);gap:8px;align-items:center;padding:8px;border:2px solid #e3dcc5;border-radius:8px;background:#fff;margin-bottom:6px}
.ev.done{background:#f1eedf}
.ev.done .tt{text-decoration:line-through;color:#8b8a7a}
.chk{width:26px;height:26px;border:3px solid var(--deep);border-radius:5px;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--olive);border-color:var(--deep)}
.chk[aria-pressed="true"]::after{content:"";width:10px;height:5px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tm{font-size:12px;font-weight:700;color:#5b6150;font-variant-numeric:tabular-nums}
.tt{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.tt small{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:#fff;padding:1px 6px;border-radius:3px;vertical-align:1px}
.msg{font-size:13px;color:#5b4a1d;background:#fff3c4;border:2px solid #e9cf74;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty{font-size:13px;color:#6b6f60;margin:8px 0}
form.add{display:grid;gap:8px;background:#f3f6e4;border:2px solid #cdd69c;border-radius:10px;padding:10px;margin-bottom:6px}
form.add label{font-size:12px;font-weight:700;color:#4a5230;display:grid;gap:4px}
form.add input,form.add select{font:inherit;font-size:16px;padding:8px;border:2px solid #b9c27e;border-radius:7px;background:#fff;color:#26301f;min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.here{font-size:12px;color:var(--muted);background:var(--panel);border:2px dashed var(--line);border-radius:6px;padding:7px 10px}
.here b{color:var(--warm)}
.emotes{display:flex;flex-wrap:wrap;gap:6px}
.emotes button{font:inherit;font-size:13px;font-weight:700;background:var(--panel);color:var(--fg);border:2px solid var(--olive);border-radius:999px;padding:6px 12px;cursor:pointer}
.emotes button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:10px}
.sw{width:38px;height:38px;border-radius:8px;border:3px solid #fff;box-shadow:0 0 0 2px #b9c27e;cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--deep)}
.gb{display:grid;gap:6px;margin-top:6px}
.gb-row{background:#fff;border:2px solid #e3dcc5;border-radius:8px;padding:8px 10px}
.gb-row b{font-size:12px;color:#fff;padding:1px 7px;border-radius:4px;margin-right:6px}
.gb-row p{margin:4px 0 0;font-size:14px;overflow-wrap:anywhere}
.gb-row time{font-size:11px;color:#8b8a7a}
form.add textarea{font:inherit;font-size:16px;padding:8px;border:2px solid #b9c27e;border-radius:7px;background:#fff;color:#26301f;resize:vertical;min-height:64px;width:100%}
.chat{background:var(--panel);border:2px solid var(--line);border-top:4px solid var(--olive);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px}
.chat ol{list-style:none;margin:0;padding:0;max-height:140px;overflow:auto;display:flex;flex-direction:column;gap:3px;font-size:13px}
.chat ol li b{color:var(--warm);margin-right:4px}
.chat ol li.sys{color:var(--muted);font-size:12px}
.chat form{display:flex;gap:6px}
.chat input{flex:1;min-width:0;font:inherit;font-size:16px;padding:7px 9px;border-radius:6px;border:2px solid var(--line);background:#1f2b23;color:var(--fg)}
.chat button{font:inherit;font-size:13px;font-weight:700;background:var(--accent);color:#2a1d05;border:0;border-radius:6px;padding:0 14px;cursor:pointer}
.bellicon[aria-pressed="false"]{color:var(--muted)}
.bellicon[aria-pressed="true"] .slash{display:none}
.iconbtn{width:40px;height:36px;display:grid;place-items:center;background:var(--panel);color:var(--warm);border:2px solid var(--line);border-radius:6px;cursor:pointer;padding:0}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bell{font:inherit;font-size:13px;font-weight:700;background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
.bell[aria-pressed="true"]{border-color:var(--accent);color:var(--warm)}
.bell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.walkbtn{position:absolute;left:8px;top:8px;z-index:3;font:inherit;font-size:12px;font-weight:700;padding:6px 10px;background:rgba(255,253,243,.94);color:#1f4a33;border:2px solid #1f4a33;border-radius:999px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.walkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.awaynote{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;background:rgba(255,253,243,.95);color:#26301f;border:2px solid #1f4a33;border-radius:10px;padding:8px 14px;font-size:13px;text-align:center;line-height:1.5;box-shadow:0 3px 0 rgba(0,0,0,.2);white-space:nowrap}
.awaynote b{color:#1f4a33}
@media (max-width:360px){.iconbtn{width:34px;height:32px}.clock{font-size:10px;padding:6px 7px}}
.cambtn{position:absolute;left:8px;bottom:8px;z-index:3;width:42px;height:38px;display:grid;place-items:center;background:rgba(255,253,243,.94);color:#1f4a33;border:2px solid #1f4a33;border-radius:8px;cursor:pointer;padding:0;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.cambtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cambtn:active{transform:translateY(1px)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.pola{margin:0;background:#fffdf6;padding:6px 6px 8px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.18);border:1px solid #ece5cf}
.pola img{display:block;width:100%;aspect-ratio:4/5;image-rendering:pixelated;border-radius:2px;background:#d6c29b}
.pola figcaption{font-size:12px;margin-top:6px;color:#3a3a30;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pola figcaption b{font-size:11px;color:#fff;padding:1px 6px;border-radius:4px}
.pola figcaption time{color:#8b8a7a;font-size:11px}
.shotPrev{max-width:230px;margin:4px auto 0;transform:rotate(-1.5deg)}
.shot-acts{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.shot-acts .ib{text-decoration:none;display:inline-flex;align-items:center}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px 12px;margin-top:6px;padding:4px}
.album .pola{cursor:pointer;transform:rotate(-1.2deg)}
.album .pola:nth-child(even){transform:rotate(1.4deg)}
@media (prefers-reduced-motion:reduce){.flash.go{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;border:2px solid var(--accent);z-index:30;font-size:13px}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="hbar">
    <h1>Bunny's Office</h1>
    <div style="display:flex;gap:6px;align-items:center;flex:none"><button class="iconbtn bellicon" id="bellBtn" type="button" aria-pressed="false" aria-label="벨소리 꺼짐" title="벨소리 꺼짐"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M7 1h2v1h1v1h1v1h1v5h1v1h1v2H2v-2h1V9h1V4h1V3h1V2h1zM6 13h4v1H9v1H7v-1H6z"/><path class="slash" fill="currentColor" d="M2 1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-1H9V9H8V8H7V7H6V6H5V5H4V4H3V3H2z"/></svg></button><button class="iconbtn" id="reloadBtn" type="button" aria-label="화면 새로고침" title="새로고침"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M7 2h4v1h1v1h1V2h1v5H9V6h2V5h-1V4H7v1H6v1H5v4h1v1h1v1h3v-1h1v-1h1V9h2v2h-1v1h-1v1h-1v1H6v-1H5v-1H4v-1H3V6h1V5h1V4h1V3h1z"/></svg></button><span class="clock" id="clock">--:--</span></div>
    </div>
    <div class="work" id="work"></div>
  </header>

  <div class="stage">
    <canvas id="home" width="160" height="200" aria-label="픽셀 작업방. 내가 책상, 빈백, 러그를 오가고 강아지 두 마리가 따라다닙니다."></canvas>
    <div class="ov" id="ov"></div>
    <div class="flash" id="flash"></div>
    <button class="walkbtn" id="walkBtn" type="button" hidden></button>
    <div class="awaynote" id="awayNote" hidden>지금은 제로 콜라랑 <b>산책 중</b>이에요<br>1시에 돌아와요 🐾</div>
    <button class="cambtn" id="camBtn" type="button" aria-label="인증샷 찍기" title="인증샷 찍기"><svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M5 3h6v1h3v1h1v8h-1v1H2v-1H1V5h1V4h3zM7 6v1H6v1H5v3h1v1h1v1h2v-1h1v-1h1V8h-1V7H9V6zM12 5v1h1V5z"/><path fill="currentColor" d="M7 8h2v2H7z"/></svg></button>
  </div>

  <div class="cast" id="cast" hidden></div>
  <div class="here" id="here" hidden></div>
  <div class="emotes" id="emotes" hidden>
    <button type="button" data-say="안녕!">안녕!</button>
    <button type="button" data-say="놀러 왔어요">놀러 왔어요</button>
    <button type="button" data-say="강아지 너무 귀여워">강아지 귀여워</button>
    <button type="button" data-say="오늘도 화이팅!">화이팅!</button>
  </div>
  <div class="chat" id="chat" hidden>
    <ol id="chatLog" aria-live="polite"></ol>
    <form id="chatForm"><input id="chatIn" maxlength="60" placeholder="방에 있는 사람들에게 한마디" autocomplete="off"><button type="submit">보내기</button></form>
  </div>

  <div class="row">
    <p class="hint">방명록·우체통·책장 액자를 눌러 보세요. 왼쪽 아래 카메라로 인증샷도 찰칵!<br>나를 누르면 쓰담, 제로콜라 캔은 한 모금, 빈백은 휴식, 컴퓨터는… 화내요. 오른쪽 문은 휴게실이에요.</p>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sh-head">
      <h2 id="sh-title">이번 주 일정</h2>
      <button class="ib" id="sh-reload" type="button">새로고침</button>
      <button class="ib go" id="sh-add" type="button">+ 추가</button>
      <button class="ib" id="sh-close" type="button" aria-label="닫기">닫기</button>
    </div>
    <form class="add" id="addForm" hidden>
      <label for="f-title">무슨 일정이에요?<input id="f-title" required maxlength="120" placeholder="예: 블로그 글 올리기"></label>
      <div class="two">
        <label for="f-date">날짜<input id="f-date" type="date" required></label>
        <label for="f-time">시간 (비우면 하루 종일)<input id="f-time" type="time"></label>
      </div>
      <label for="f-cal">캘린더<select id="f-cal"></select></label>
      <button class="ib go" id="f-save" type="submit">달력에 붙이기</button>
    </form>
    <div id="calBody"></div>
  </div>
</div>
<div class="scrim" id="joinScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="join-title">
    <div class="sh-head"><h2 id="join-title">놀러 오셨군요!</h2></div>
    <form class="add" id="joinForm">
      <label for="j-nick">방에서 쓸 이름<input id="j-nick" required maxlength="10" placeholder="예: 민지"></label>
      <label>옷 색깔<div class="swatches" id="swatches"></div></label>
      <button class="ib go" type="submit">방에 들어가기</button>
    </form>
    <p class="empty">들어가면 방 주인과 다른 친구들에게 내 캐릭터가 보여요.</p>
    <form class="add" id="ownerForm" hidden>
      <label for="o-key">방 주인 열쇠<input id="o-key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="열쇠를 붙여 넣으세요"></label>
      <button class="ib" type="submit">주인으로 들어가기</button>
    </form>
  </div>
</div>
<div class="scrim" id="gbScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gb-title">
    <div class="sh-head">
      <h2 id="gb-title">방명록</h2>
      <button class="ib" id="gb-album" type="button">인증샷 앨범</button>
      <button class="ib" id="gb-close" type="button">닫기</button>
    </div>
    <form class="add" id="gbForm">
      <label for="gb-text">한마디 남기기<textarea id="gb-text" required maxlength="100" placeholder="다녀갑니다! 제로 콜라 안녕"></textarea></label>
      <button class="ib go" id="gb-save" type="submit">남기기</button>
    </form>
    <p class="empty" id="gbNote" hidden></p>
    <div class="gb" id="gbList"></div>
  </div>
</div>
<div class="scrim" id="shotScrim" hidden>

function dayLabel(day){

  const wd='일월화수목금토'[d.getDay()];const md=`${d.getMonth()+1}/${d.getDate()}(${wd})`;
  return diff===0?`오늘 · ${md}`:diff===1?`내일 · ${md}`:md;
}

    if(btn){const b=document.createElement('button');b.type='button';b.className='ib go';b.textContent=btn;b.onclick=loadEvents;m.appendChild(b);}calBody.appendChild(m);};
  if(cal.state==='nomcp'){box('이 화면에서는 달력을 열 수 없어요. claude.ai에 로그인한 Claude 앱이나 브라우저에서 열어 주세요.');return;}
  if(cal.state==='error'){const c=cal.err&&cal.err.code;box(errText(cal.err),['not_in_manifest','approval_required','consent_required','server_unavailable','upstream_error','tool_error'].includes(c)||!c?'다시 불러오기':null);
    const sm=document.createElement('p');sm.className='empty';sm.textContent='오류 코드: '+(c||'알 수 없음');calBody.appendChild(sm);return;}
  if(cal.state==='loading'&&!cal.loaded){const p=document.createElement('p');p.className='empty';p.textContent='달력 넘기는 중…';calBody.appendChild(p);return;}
  if(cal.partial){const p=document.createElement('p');p.className='empty';p.textContent='일부 캘린더는 불러오지 못했어요.';calBody.appendChild(p);}
  if(!cal.events.length){const p=document.createElement('p');p.className='empty';p.textContent='이번 주는 일정이 없어요. 위의 + 추가로 하나 붙여 볼까요?';calBody.appendChild(p);return;}
  let cur=null;
  cal.events.forEach(ev=>{
    if(ev.day!==cur){cur=ev.day;const h=document.createElement('div');h.className='day';h.textContent=dayLabel(ev.day);calBody.appendChild(h);}

    row.append(b,tm,tt);calBody.appendChild(row);
  });
}

function onPeerList(list){
  const alive=new Set();let host=false;const names=[];
  list.forEach(pe=>{
    if(pe.kind!=='viewer')return;const pr=pe.presence||{};
    if(pr.host){host=true;
      if(!pe.isMe&&pr.say&&pr.say.at!==seenSay[pe.peer]){seenSay[pe.peer]=pr.say.at;const me=byId.me;me.pop=3;me.popText=String(pr.say.text||'').slice(0,20);}

      return;}
    if(!pr.nick)return;
    names.push(String(pr.nick).slice(0,10)+(pe.isMe?'(나)':''));
    if(pe.isMe)return;
    alive.add(pe.peer);
    let g=guests.get(pe.peer);
    const color=SHIRTS.includes(pr.color)?pr.color:SHIRTS[0];
    const tx=Math.max(12,Math.min(148,+pr.x||80)),ty=Math.max(66,Math.min(190,+pr.y||150));
    if(!g){g={nick:String(pr.nick).slice(0,10),color,x:tx,y:ty,tx,ty,frame:0,ft:0,flip:false,say:'',sayUntil:0};makeTag(g);guests.set(pe.peer,g);
      ringBell(g.nick);}
    g.color=color;g.tx=tx;g.ty=ty;g.scene=pr.scene==='work'?'work':'lounge';
    if(pr.say&&pr.say.at!==seenSay[pe.peer]){seenSay[pe.peer]=pr.say.at;g.say=String(pr.say.text||'').slice(0,20);g.sayUntil=performance.now()/1000+3;}
    if(pr.pet&&pr.pet.at!==seenPet[pe.peer]){seenPet[pe.peer]=pr.pet.at;const dg=byId[pr.pet.d];if(dg&&dg.kind==='dog'){heart(dg.x-4,dg.y-22);dg.pop=2;dg.popText='멍!';}}
  });

  hereEl.hidden=false;
  const others=names.filter(n=>!n.endsWith('(나)'));
  hereEl.innerHTML='';
  const b=document.createElement('b');
  if(IS_OWNER){b.textContent=others.length?`놀러 온 친구 ${others.length}명`:'아직 놀러 온 친구가 없어요';hereEl.appendChild(b);if(others.length)hereEl.append(' · '+others.join(', '));}

}
function drawGuests(items,dt){

  all.forEach(g=>{
    const here=(g.scene||'work')===VIEW;if(g.el)g.el.style.display=here?'':'none';if(!here){g.x=g.tx;g.y=g.ty;return;}
    const dx=g.tx-g.x,dy=g.ty-g.y,dd=Math.hypot(dx,dy);let walking=false;
    if(dd>.5){const mv=Math.min(dd,30*dt);g.x+=dx/dd*mv;g.y+=dy/dd*mv;walking=true;if(Math.abs(dx)>.5)g.flip=dx>0;g.ft+=dt;if(g.ft>.15){g.ft=0;g.frame=g.frame===1?2:1;}}else if(VIEW==='walk'){walking=true;g.ft+=dt;if(g.ft>.18){g.ft=0;g.frame=g.frame===1?2:1;}}else g.frame=0;
    items.push({y:g.y,draw:()=>{const x=Math.round(g.x),y=Math.round(g.y);R(x-7,y-1,14,2,'rgba(0,0,0,.14)');sprite2('person',guestLook(g.color),'stand',walking?g.frame:0,false,x-8,y-26);}});

  });
}

/* ---------- doorbell ---------- */
let actx=null,bellOn=false,titleTimer=null;const baseTitle=document.title;
try{bellOn=localStorage.getItem('bell')==='on';}catch{}
const bellBtn=$('bellBtn');
function bellLabel(){const t=bellOn?'벨소리 켜짐':'벨소리 꺼짐';bellBtn.setAttribute('aria-pressed',String(bellOn));bellBtn.setAttribute('aria-label',t);bellBtn.title=t;}
function unlock(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch{actx=null;}}
function tone(f,start,len,vol){const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.value=f;o2.type='triangle';o2.frequency.value=f*2;
  const g2=actx.createGain();g2.gain.value=.15;o2.connect(g2);g2.connect(g);o.connect(g);g.connect(actx.destination);
  const t0=actx.currentTime+start;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+len);
  o.start(t0);o2.start(t0);o.stop(t0+len+.05);o2.stop(t0+len+.05);}
function ding(){if(!bellOn||!actx||actx.state!=='running')return;tone(659.3,0,.9,.35);tone(523.3,.45,1.2,.35);}
function ringBell(nick){
  ding();toast(`딩동! ${nick} 님이 놀러 왔어요 · 휴게실로 가요`);

}

  const avail=st.getBoundingClientRect().width,dpr=window.devicePixelRatio||1,k=Math.floor(avail*dpr/W);

/* night lighting */
function glow(x,y,r,rgb,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function lampGlow(t){
  if(VIEW!=='work')return;const h=new Date().getHours(),a=isNight()?1.5:(h>=18||h<7)?.8:.4,fl=1+Math.sin(t*1.3)*.04;
  ctx.globalCompositeOperation='lighter';
  glow(50,44,14*fl,'255,214,120',.32*a);           // shelf lamp
  glow(12,128,12*fl,'255,220,150',.45*a);glow(14,146,22*fl,'255,205,120',.28*a); // floor lamp + pool of light under the beanbag
  ctx.globalCompositeOperation='source-over';
}
function lighting(t){
  if(!isNight())return lampGlow(t);
  ctx.fillStyle='rgba(16,22,48,.48)';ctx.fillRect(6,6,148,188);
  ctx.globalCompositeOperation='lighter';
  if(VIEW==='work'){
    glow(80,40,28,'120,210,220',.28);glow(80,22,24,'150,170,255',.1);
    for(let i=0;i<12;i+=2)glow(58+i*4,13,7,'255,214,120',.22);
    glow(21,40,24+Math.sin(t*2)*2+(treeFlash>t?8:0),'255,190,100',.4);
    ctx.globalCompositeOperation='source-over';lampGlow(t);ctx.globalCompositeOperation='lighter';
  }else{
    glow(137,168,30,'255,214,140',.45);glow(72,110,30,'255,225,170',.25);
  }
  ctx.globalCompositeOperation='source-over';
}

/* loop */
const clockEl=document.getElementById('clock');
let last=performance.now();
const workEl=document.getElementById('work');let lastPer=null,lastSec=-1,nextHeart=0;
function left(d,hh){const m=hh*60-(d.getHours()*60+d.getMinutes());return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`;}
function workText(p,d){
  if(p==='work')return d.getHours()<12?`근무 중 · 점심까지 <b>${left(d,11.5)}</b>`:`근무 중 · 퇴근까지 <b>${left(d,18)}</b>`;
  if(p==='lunch')return`점심시간 · 다 먹으면 제로 콜라랑 산책!`;
  if(p==='walk')return`제로 콜라랑 산책 중 · 돌아오기까지 <b>${left(d,13)}</b>`;
  if(p==='morning')return`굿모닝 · 8시에 아침 청소`;
  if(p==='clean')return`아침 청소 중 · 출근까지 <b>${left(d,9)}</b>`;
  if(p==='breakfast')return`아침 먹는 중 · 출근까지 <b>${left(d,9)}</b>`;
  if(p==='dinner')return'퇴근! 저녁 먹는 중 · 오늘도 수고했어요';
  if(p==='overtime')return`오늘은 야근 중… 조금만 더 · <b>${left(d,21.5)}</b> 남음`;
  if(p==='evening')return'퇴근 후 휴식 · 오늘도 수고했어요';
  return'잘 시간 · 내일 9시에 만나요';
}
function step(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
  const d=new Date();clockEl.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const per=period();
  if(per!==lastPer){if(lastPer)ACTORS.forEach(a=>{if(!a.path.length)a.until=0;});lastPer=per;}
  const ok=outfitKey();if(byId.me.look!==OUTFIT[ok]){byId.me.look=OUTFIT[ok];const c=byId.me.avatar;if(c){c.clearRect(0,0,14,14);person(c,3,1,byId.me.look,'stand',0);}
    if(lastSec!==-1){byId.me.pop=2.6;byId.me.popText=ok==='work'?'출근 준비 완료! 후드티 착용':'잠옷으로 갈아입었어요';}}
  if(d.getSeconds()!==lastSec){lastSec=d.getSeconds();workEl.innerHTML=workText(per,d);}
  {const out=byId.me.scene==='walk',wb=$('walkBtn');wb.hidden=!out;if(out){const tx=VIEW==='walk'?'🏠 빈 집 보기':'🐾 산책 따라가기';if(wb.textContent!==tx)wb.textContent=tx;}
   $('awayNote').hidden=!(out&&VIEW!=='walk');}
  // playtime: hearts and hops around the dogs
  if((byId.me.actKey==='play'||byId.me.actKey==='l_play')&&!byId.me.path.length&&t>nextHeart){nextHeart=t+1.4;
    const dg=Math.random()<.5?byId.latte:byId.choco;heart(dg.x-3,dg.y-22);dg.pop=1.9;dg.popText=Math.random()<.5?'멍!':'왈!';}
  if(LOC_PREF==='lounge'&&t>prefUntil){LOC_PREF='work';byId.me.pop=2.6;byId.me.popText='쉬었으니 다시 일하러!';}
  const friends=guests.size>0||!!selfG,sl=schedLoc(),want=sl==='walk'?'walk':friends?'lounge':(sl||LOC_PREF);
  if(want!==LOC&&!step.placed){LOC=want;ACTORS.forEach(a=>{a.dest=LOC;a.path=[];arrive(a);});}
  step.placed=true;
  if(want!==LOC){const from=LOC;LOC=want;viewManual=false;ACTORS.forEach(a=>travel(a,LOC));
    if(!friends)toast(LOC==='walk'?'제로 콜라랑 산책 다녀올게요!':from==='walk'?'산책 끝! 다녀왔습니다':LOC==='lounge'?(sl?'밥 먹으러 휴게실로 가요':'휴게실로 쉬러 가요'):'작업방으로 돌아가요');}
  ACTORS.forEach(a=>{
    if(a.pop>0)a.pop-=dt;
    if(a.scene==='walk'){a.ft+=dt;if(a.ft>(a.kind==='dog'?.13:.18)){a.ft=0;a.frame=a.frame===1?2:1;}
      const w=WALKPOS[a.id],ph={me:0,latte:1.7,choco:3.1}[a.id];a.x=w.x+Math.sin(t*.7+ph)*(a.kind==='dog'?4:1.5);a.y=w.y+Math.sin(t*.5+ph*2)*(a.kind==='dog'?2:.5);
      a.pose=a.kind==='dog'?'walk':'stand';a.flip=true;return;}
    if(a.target==='__door'&&!a.path.length){arrive(a);}
    if(t>a.until&&!a.path.length)nextAct(a,t);
    const speed=a.kind==='dog'?40:30;
    if(a.follow){
      const o=byId[a.follow],off=a.id==='latte'?{x:-16,y:6}:{x:16,y:8};
      if(o.scene!==a.scene){a.follow=null;a.until=0;return;}
      let tx=Math.max(14,Math.min(146,o.x+off.x)),ty=Math.max(a.scene==='lounge'?70:90,Math.min(190,o.y+off.y));
      // dogs wait on the floor in front of furniture instead of climbing onto it
      const blk=(BLOCK[a.scene]||[]).find(b=>tx>b[0]&&tx<b[2]&&ty>b[1]&&ty<b[3]);
      if(blk){if(blk[4]==='left'){tx=blk[0]-10+(a.id==='latte'?0:-6);ty=a.id==='latte'?152:170;}else if(blk[4]==='right'){tx=blk[2]+6;}else ty=blk[3]+(a.id==='latte'?8:12);}
      const dx=tx-a.x,dy=ty-a.y,dd=Math.hypot(dx,dy);
      if(dd>3){const mv=Math.min(dd,(speed+(dd>30?24:0))*dt);a.x+=dx/dd*mv;a.y+=dy/dd*mv;if(Math.abs(dx)>.5)a.flip=dx>0;a.pose='walk';a.ft+=dt;if(a.ft>.14){a.ft=0;a.frame=a.frame===1?2:1;}}
      else a.pose='sit';
      return;
    }
    if(!a.path.length)return;
    let mv=speed*dt;
    while(mv>0&&a.path.length){const p=a.path[0],dx=p.x-a.x,dy=p.y-a.y,dd=Math.hypot(dx,dy);
      if(Math.abs(dx)>.5)a.flip=dx>0;
      if(dd<=mv){a.x=p.x;a.y=p.y;mv-=dd;a.path.shift();}else{a.x+=dx/dd*mv;a.y+=dy/dd*mv;mv=0;}}
    a.pose=a.kind==='dog'?'walk':'stand';a.ft+=dt;if(a.ft>.15){a.ft=0;a.frame=a.frame===1?2:1;}
    if(!a.path.length){a.frame=0;const s=a.target&&SPOT[a.target];a.pose=s?s.pose:(a.kind==='dog'?'sit':'stand');}
  });
  if(VIEW==='walk')drawWalk(t);else if(VIEW==='work')drawRoom(t);else drawLounge(t);
  if(VIEW==='work')softShadows();
  if(VIEW==='lounge')loungeShadows();
  (VIEW==='walk'?[]:VIEW==='work'?SHADOWS:LSHADOWS).forEach(([x,y,w])=>{R(x,y,w,3,'rgba(70,50,25,.16)');R(x+2,y+3,w-4,1,'rgba(70,50,25,.1)');});
  const items=(VIEW==='walk'?[]:VIEW==='work'?FURN:LFURN).map((f,i)=>({y:f.y,draw:()=>{{const k=(VIEW==='work'?'f':'l')+i;if(!OL[k])OL[k]=outlineOf(f.d,W,H);ctx.drawImage(OL[k],0,0);}f.d(t);}}));
  ACTORS.filter(a=>a.scene===VIEW).forEach(a=>items.push({y:a.y,draw:()=>{
    const x=Math.round(a.x),y=Math.round(a.y);
    if(a.kind==='dog'){R(x-7,y-1,14,2,'rgba(0,0,0,.13)');const hop=(a.pop>1.6)?-2:0;sprite2('dog',a.look,a.pose,a.frame,a.flip,x-8,y-17+hop);}
    else{const st=a.pose!=='sit'&&a.pose!=='sitback';if(st)R(x-7,y-1,14,2,'rgba(0,0,0,.14)');
      const bob=a.pose==='stretch'&&Math.floor(t*2)%2?-1:0;
      sprite2('person',a.look,a.pose,a.frame,false,x-8,y-(st?26:22)+bob);
      if(a.id==='me'&&period()==='clean'&&String(a.actKey).startsWith('clean')){const v=Math.floor(t*6)%2;R(x+7,y-14,1,12,'#3e3f3a');R(x+6,y-15,3,2,'#2a2a2a');R(x+5,y-3+v,7,3,'#c0574a');R(x+5,y-3+v,7,1,'#d27766');R(x+4,y,9,1,'#2a2a2a');
        if(!a.path.length&&Math.random()<.08)fizz.push({x:x+8+Math.random()*6,y:y-1,vy:4+Math.random()*4,life:.6});}}
  }}));
  drawGuests(items,dt);
  items.sort((p,q)=>p.y-q.y).forEach(i=>i.draw());
  if(VIEW==='walk')drawLeash();
  else if(byId.me.scene==='walk')drawAwaySign();
  lighting(t);
  drawFizz(dt);drawAngry(t);
  drawHearts(dt);
  ACTORS.forEach(a=>{
    a.el.style.display=a.scene===VIEW?'':'none';
    const top=a.kind==='dog'?(a.pose==='sleep'?11:18):(a.pose==='sit'||a.pose==='sitback'?23:a.pose==='stretch'?29:27);
    a.el.style.left=a.x/W*100+'%';a.el.style.top=(a.y-top)/H*100+'%';
    const moving=a.kind==='dog'?a.pose==='walk':a.path.length>0;
    const txt=a.pop>0?a.popText:(a.id==='me'&&!moving?a.bubble:'');
    if(a.bEl.textContent!==txt)a.bEl.textContent=txt;
    a.bEl.className='bubble'+(a.pop>0?' pop':'');
  });
  requestAnimationFrame(step);
}
placeDoorTag();
requestAnimationFrame(step);
})();
</script>
